# The dbt-native way to keep SCD Type 2 history: each `dbt snapshot` (and `dbt build`) compares the latest poll's config
# to the open row per endpoint and closes / inserts on a change. Unlike dim_runpod_endpoint it cannot be rebuilt — the
# table *is* the history — and it samples at dbt-run cadence (the Mac's sf-runpod-load, the GitHub runpod-load backstop),
# not at poll cadence. Kept beside the derived dimension so the two can be compared.
snapshots:
  - name: snap_runpod_endpoint_config
    relation: ref('silver_runpod_endpoint_current')
    description: >
      dbt snapshot (check strategy) of each endpoint's tracked config, from the latest complete poll. dbt_valid_from is
      the poll time of the first snapshot that saw a version (updated_at = polled_at_utc); a deleted endpoint's row is
      closed at the *run* time of the snapshot that no longer saw it (dbt's hard_deletes uses snapshot_get_time), so
      versions start on poll time but deletions end on run time. Written only by the GitHub runpod-load job (the Mac's
      sf-runpod-load excludes it), so two writers never merge into it at once.
    config:
      schema: SILVER
      unique_key: endpoint_id
      strategy: check
      check_cols: [gpu_ids, min_cuda, allowed_cuda, image, locations, disk_gb, flashboot, idle_timeout_s,
                   scaling_type, scaling_value, request_timeout_ms, network_volumes]
      updated_at: polled_at_utc
      hard_deletes: invalidate
      tags: [runpod]
    data_tests:
      # a hard-deleted endpoint that comes back reopens after a gap, which is what the snapshot saw; overlaps, ties and
      # two open rows are still errors
      - scd2_windows: {arguments: {key: endpoint_id, valid_from: dbt_valid_from, valid_to: dbt_valid_to, allow_gaps: true}}
