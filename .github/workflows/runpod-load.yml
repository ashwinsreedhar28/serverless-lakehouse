# Every 3 hours: land whatever new run files reached data/sources/runpod/ (load generator, campaign) into data/landing/
# with `land --only runpod` (no emberserve / Pulse checkout needed) — in the runner's workspace only, nothing is committed:
# the Mac owns data/landing/ and docs/spend_log.md (`make sf-sync`), so the two never fight over manifest.json. Then COPY
# the new files and the Runpod snapshots that reached @RUNPOD into bronze, verify, rebuild silver + gold + the runpod models,
# and print the spend log. LANDING.MANIFEST_SNAPSHOT is a union across writers (lakehouse/sf/bronze.py), so a campaign file
# the Mac landed but has not pushed yet stays current here. One warehouse resume (~1–2 min of X-Small) per run.
name: runpod-load
on:
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:
  push:
    branches: [scd2]   # temporary: lets the scd2 branch run the full build before it merges
concurrency: { group: loadgen, cancel-in-progress: false }
jobs:
  load:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ashwinsreedhar28' }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r snowflake/requirements.txt
      - name: write the private key
        env: { SNOWFLAKE_PRIVATE_KEY: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" }
        run: |
          install -d -m 700 "$HOME/.snowflake"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/.snowflake/lakehouse_rsa_key.p8"
          chmod 600 "$HOME/.snowflake/lakehouse_rsa_key.p8"
      - name: land new runs (runpod root only, workspace only)
        run: python -m lakehouse.land --only runpod
      - name: bronze (COPY INTO new landed files) + verify
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          python -u -m lakehouse.sf.bronze --run-label "gha_${GITHUB_RUN_ID}"
          python -u -m lakehouse.sf.verify
      - name: COPY INTO bronze_runpod_polls
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: python -u -m lakehouse.sf.runpod load --run-label "gha_${GITHUB_RUN_ID}"
      - name: dbt build (everything)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/lakehouse_rsa_key.p8
        working-directory: snowflake/dbt
        run: dbt seed --no-use-colors && dbt build --no-use-colors
      - name: endpoint config history (SCD Type 2) summary
        if: always()
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/lakehouse_rsa_key.p8
        working-directory: snowflake/dbt
        # The build's non-passing nodes and the two tables below also go out as run annotations (`gh run view` shows them).
        run: |
          python - <<'PY'
          import json, collections
          rr = json.load(open("target/run_results.json"))["results"]
          n = collections.Counter(r["status"] for r in rr)
          bad = [f'{r["status"]}: {r["unique_id"].split(".")[-1]} ({r.get("failures")})' for r in rr if r["status"] not in ("success", "pass")]
          print(f"::notice title=dbt build::{dict(n)}" + "%0A" + "%0A".join(bad[:40]))
          PY
          dbt show --no-use-colors --select gold_scd2_asof_agreement | tee show_agreement.txt
          dbt show --no-use-colors --inline "
            select 'polls' as history, count(*) as n_versions, count(distinct endpoint_id) as n_endpoints,
                   count_if(is_current) as n_current, count_if(is_deleted) as n_deleted from {{ ref('dim_runpod_endpoint') }}
            union all select 'release log', count(*), count(distinct endpoint_id), count_if(is_current), count_if(is_deleted)
              from {{ ref('dim_runpod_endpoint_release') }}
            union all select 'dbt snapshot', count(*), count(distinct endpoint_id), count_if(dbt_valid_to is null), null
              from {{ ref('snap_runpod_endpoint_config') }}" | tee show_versions.txt
          for f in show_agreement.txt show_versions.txt; do
            echo "::notice title=$f::$(grep '^|' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - name: spend log
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: python -u -m lakehouse.sf.spend && cat docs/spend_log.md
