# Every 3 hours: land whatever new run files reached data/sources/runpod/ (load generator, campaign) into data/landing/
# with `land --only runpod` (no emberserve / Pulse checkout needed) — in the runner's workspace only, nothing is committed:
# the Mac owns data/landing/ and docs/spend_log.md (`make sf-sync`), so the two never fight over manifest.json. Then COPY
# the new files and the Runpod snapshots that reached @RUNPOD into bronze, verify, rebuild silver + gold + the runpod models,
# and print the spend log. LANDING.MANIFEST_SNAPSHOT is a union across writers (lakehouse/sf/bronze.py), so a campaign file
# the Mac landed but has not pushed yet stays current here. One warehouse resume (~1–2 min of X-Small) per run.
name: runpod-load
on:
  schedule:
    - cron: "19 */3 * * *"
  workflow_dispatch:
  push:
    branches: [scd2-audit2]   # temporary: run the full build on the audit-fix branch before it merges
concurrency: { group: loadgen, cancel-in-progress: false }
jobs:
  load:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ashwinsreedhar28' }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r snowflake/requirements.txt
      - name: write the private key
        env: { SNOWFLAKE_PRIVATE_KEY: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" }
        run: |
          install -d -m 700 "$HOME/.snowflake"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$HOME/.snowflake/lakehouse_rsa_key.p8"
          chmod 600 "$HOME/.snowflake/lakehouse_rsa_key.p8"
      - name: land new runs (runpod root only, workspace only)
        run: python -m lakehouse.land --only runpod
      - name: bronze (COPY INTO new landed files) + verify
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          python -u -m lakehouse.sf.bronze --run-label "gha_${GITHUB_RUN_ID}"
          python -u -m lakehouse.sf.verify
      - name: COPY INTO bronze_runpod_polls
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        # on failure the tail of the output also goes out as an annotation (the job log is not always reachable)
        run: |
          set +e
          python -u -m lakehouse.sf.runpod load --run-label "gha_${GITHUB_RUN_ID}" 2>&1 | tee load.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -ne 0 ] && echo "::error title=runpod load::$(tail -c 1500 load.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit "$rc"
      - name: dbt build (everything)
        id: build
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/lakehouse_rsa_key.p8
        working-directory: snowflake/dbt
        run: dbt seed --no-use-colors && dbt build --no-use-colors
      # The job log is not always reachable from where this repo is worked on, so the build's outcome and the SCD2 figures
      # also go out as run annotations (`gh run view` / the checks API show them).
      - name: dbt build result
        if: always() && steps.build.outcome != 'skipped'
        working-directory: snowflake/dbt
        run: |
          python - <<'PY'
          import json, collections, os
          p = "target/run_results.json"
          rr = json.load(open(p))["results"] if os.path.exists(p) else []
          n = collections.Counter(r["status"] for r in rr)
          bad = [f'{r["status"]}: {r["unique_id"].split(".")[-1]} ({r.get("failures")})' for r in rr if r["status"] not in ("success", "pass")]
          print(f"::notice title=dbt build::{dict(n)}" + "".join("%0A" + b for b in bad[:40]))
          PY
      - name: endpoint config history (SCD Type 2) figures
        if: steps.build.outcome == 'success'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          python - <<'PY'
          from lakehouse.sf.client import connect
          # informational step: every failure, the connection included, is a warning and never fails the backstop
          try:
              conn = connect("GOLD")
          except Exception as e:
              print(f"::warning title=SCD2 figures::could not connect: {type(e).__name__}: {e}".replace("\n", " "))
          else:
              try:
                  cur = conn.cursor()
                  for table, sql in [
                      ("gold_scd2_history_summary", "select metric, value, detail from GOLD.gold_scd2_history_summary order by ord"),
                      ("gold_scd2_asof_agreement", "select history, attribute, n_cold_starts, n_agree, pct_agree from GOLD.gold_scd2_asof_agreement"),
                  ]:
                      try:
                          rows = cur.execute(sql).fetchall()
                          lines = [" | ".join("" if v is None else str(v) for v in r) for r in rows]
                          print(table, *lines, sep="\n")
                          print(f"::notice title={table}::" + "%0A".join(lines))
                      except Exception as e:
                          print(f"::warning title={table}::{type(e).__name__}: {e}".replace("\n", " "))
              finally:
                  conn.close()
          PY
      - name: spend log
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: python -u -m lakehouse.sf.spend && cat docs/spend_log.md
