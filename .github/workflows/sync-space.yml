# Push space/ to the Hugging Face Space whenever it changes on main.
# One-time setup in the GitHub repo: Settings → Secrets → HF_TOKEN (a write token from huggingface.co/settings/tokens)
# and Settings → Variables → HF_SPACE = <hf-username>/serverless-lakehouse (create the Space first: Docker SDK, blank
# template — space/Dockerfile runs Streamlit on port 7860). Uses the `hf` CLI (huggingface_hub ≥ 1.0 removed huggingface-cli).
name: sync-space
on:
  push:
    branches: [main]
    paths: ["space/**"]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "huggingface_hub>=1.0,<2"
      - name: upload space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          hf upload "$HF_SPACE" space . --repo-type space \
            --commit-message "sync from github ${GITHUB_SHA::7}"
