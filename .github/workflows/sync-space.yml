# Push the static dashboard to the Hugging Face Space whenever it changes on main.
# One-time setup in the GitHub repo: Settings → Secrets → HF_TOKEN (a write token from huggingface.co/settings/tokens)
# and Settings → Variables → HF_SPACE = <hf-username>/serverless-lakehouse. Create the Space first with
# `make space-login && make space-create HF_SPACE=…` (static SDK — free; Docker Spaces need HF PRO).
# Uses the `hf` CLI (huggingface_hub ≥ 1.0 removed huggingface-cli).
name: sync-space
on:
  push:
    branches: [main]
    paths: ["docs/dashboard.html", "space-static/**"]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "huggingface_hub>=1.0,<2"
      - name: upload the static dashboard to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cp docs/dashboard.html space-static/index.html
          hf upload "$HF_SPACE" space-static . --repo-type space \
            --commit-message "sync from github ${GITHUB_SHA::7}"
