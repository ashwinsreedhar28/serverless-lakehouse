# Always-on load generator: once an hour, one cold + one warm request against the loadgen endpoint through the vendored
# emberserve cold-start script, so new Serverless runs flow into landing → bronze → silver → gold without a hand export.
# The result file is the same `serverless_coldstart` format as the benchmark series, committed to data/sources/runpod/loadgen/;
# runpod-load.yml lands and loads it every 3 h (landing + Snowflake), and `git pull && make land && make all` on the Mac
# brings the Spark side level.
#
# Kill switch: repository variable LOADGEN != "on" skips every run (no request, no cost), and
# `python tools/runpod_endpoint.py off $LOADGEN_ENDPOINT` sets the endpoint's max workers to 0 so nothing can start.
# Secrets: RUNPOD_API_KEY_RW (write permission: it submits jobs), LOADGEN_ENDPOINT (the endpoint id).
# Endpoint contract (what the cost estimate assumes): RTX 4090, min 0 / max 1 workers, idle timeout 10 s, FlashBoot on,
# minCudaVersion 12.8 — `make loadgen-setup` puts an existing endpoint into that shape. It is one of Runpod's own GitHub
# builds of the baked Qwen3 image (jw5new6lqznp0u), not a new endpoint: registry.runpod.net images can only be pulled by the
# endpoints Runpod built for them.
name: loadgen
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
concurrency: { group: loadgen, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.LOADGEN == 'on' }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "httpx>=0.27,<1"
      - name: one cold + one warm request
        env:
          RUNPOD_API_KEY_RW: ${{ secrets.RUNPOD_API_KEY_RW }}
          LOADGEN_ENDPOINT: ${{ secrets.LOADGEN_ENDPOINT }}
          LOADGEN_LABEL: ${{ vars.LOADGEN_LABEL || 'loadgen_4090_flashboot_on_baked' }}
          LOADGEN_IMAGE: ${{ vars.LOADGEN_IMAGE || 'emberserve Qwen3-8B, weights baked in (loadgen)' }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          python tools/serverless_coldstart.py --mode queue --endpoint "$LOADGEN_ENDPOINT" --api-key "$RUNPOD_API_KEY_RW" \
            --repeats 1 --idle-s 0 --zero-wait-s 120 --max-tokens 16 --timeout-s 600 \
            --label "$LOADGEN_LABEL" --image "$LOADGEN_IMAGE" --note "loadgen hourly $stamp" \
            --out "data/sources/runpod/loadgen/serverless_coldstart_${LOADGEN_LABEL}_${stamp}.json"
      - name: commit the run
        run: |
          git config user.name "loadgen[bot]"
          git config user.email "loadgen@users.noreply.github.com"
          git add data/sources/runpod/loadgen/
          git commit -m "loadgen: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || exit 0
          git pull --rebase -q && git push -q
